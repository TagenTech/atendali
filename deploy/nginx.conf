# nginx na frente do web e da API. Coloque TLS (HTTPS) aqui ou num proxy anterior
# (Cloudflare, Caddy…): PWA e notificações push exigem HTTPS.
server {
  listen 80;
  server_name _;
  client_max_body_size 2m;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/calendar text/csv image/svg+xml;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  # API (mesma origem do web: o cookie de sessão é SameSite=Strict)
  location /api/v1/ {
    proxy_pass http://api:3200/v1/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Service worker nunca em cache
  location = /sw.js {
    proxy_pass http://web:3201;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }

  location /_next/static/ {
    proxy_pass http://web:3201;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    proxy_pass http://web:3201;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
