name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * 1'

permissions:
  # actions: read é exigido pelo CodeQL em repositórios privados.
  actions: read
  contents: read
  security-events: write

jobs:
  analisar:
    # Em repositório privado o code scanning exige o GitHub Code Security (Advanced Security).
    # Ao ativá-lo, crie a variável de repositório CODEQL_ENABLED=true (Settings → Secrets and variables → Actions).
    if: ${{ !github.event.repository.private || vars.CODEQL_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
